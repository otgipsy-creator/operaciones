<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1">

  <title>Centro de Operaciones</title>


  <!-- =========================================================
       ICONO DE LA APLICACIÓN
       ========================================================= -->

  <link
    rel="apple-touch-icon"
    sizes="180x180"
    href="ChatGPT Image 28 sept 2026, 12_29_54 p.m..png">

  <link
    rel="icon"
    type="image/png"
    sizes="512x512"
    href="ChatGPT Image 28 sept 2026, 12_29_54 p.m..png">


  <!-- =========================================================
       MODO APLICACIÓN EN iPHONE
       ========================================================= -->

  <meta
    name="apple-mobile-web-app-capable"
    content="yes">

  <meta
    name="mobile-web-app-capable"
    content="yes">

  <meta
    name="apple-mobile-web-app-title"
    content="Centro de Operaciones">

  <meta
    name="apple-mobile-web-app-status-bar-style"
    content="black">

  <meta
    name="theme-color"
    content="#0f3d28">


  <!-- =========================================================
       ESTILOS DEL CONTENEDOR
       ========================================================= -->

  <style>

    html,
    body {
      margin: 0;
      padding: 0;

      width: 100%;
      height: 100%;

      background: #0f3d28;

      overflow: hidden;
    }


    /*
      El iframe ocupa toda la pantalla.
    */

    iframe {

      position: fixed;

      top: 0;
      left: 0;

      width: 100%;
      height: 100%;

      border: 0;

      background: #f6f3ee;
    }


    /*
      Mensaje en caso de error.
    */

    #aviso {

      display: none;

      width: 100%;
      box-sizing: border-box;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      color: #ffffff;

      padding: 28px;

      line-height: 1.5;
    }


    #aviso b {

      font-size: 20px;
    }

  </style>

</head>


<body>


  <!-- =========================================================
       MENSAJE DE ERROR
       ========================================================= -->

  <div id="aviso"></div>


  <!-- =========================================================
       APLICACIÓN
       ========================================================= -->

  <iframe
    id="app"
    title="Centro de Operaciones"
    allow="fullscreen">
  </iframe>


  <!-- =========================================================
       JAVASCRIPT
       ========================================================= -->

  <script>

    /*
    ============================================================
    URL DE TU WEB APP DE GOOGLE APPS SCRIPT
    ============================================================
    */

    var URL_APP =
      "https://script.google.com/macros/s/AKfycbylguEJ-dk1eO8J9FLl67YHmdDQmvJDgB6qsjUzcfKAGNv6lHHXUSTuOha0_Unf9ySeZQ/exec?mobile=1";


    /*
    ============================================================
    CARGAR LA APLICACIÓN
    ============================================================
    */

    (function () {

      var frame =
        document.getElementById("app");

      var aviso =
        document.getElementById("aviso");


      /*
      ------------------------------------------------------------
      Verificar que la URL esté configurada
      ------------------------------------------------------------
      */

      if (
        !/^https:\/\/script\.google\.com\/.+\/exec/.test(URL_APP)
      ) {

        frame.style.display = "none";

        aviso.style.display = "block";

        aviso.innerHTML =
          "<b>Falta configurar la URL.</b><br><br>" +

          "Abrí este archivo y verificá la variable " +

          "<b>URL_APP</b> con la URL de tu Web App " +

          "de Google Apps Script.";

        return;
      }


      /*
      ------------------------------------------------------------
      Cargar Centro de Operaciones
      ------------------------------------------------------------
      */

      frame.src = URL_APP;

    })();

  </script>


</body>

</html>
