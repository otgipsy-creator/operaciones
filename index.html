<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1">

  <title>Centro de Operaciones</title>

  <!-- Icono de la aplicación -->
  <link
    rel="apple-touch-icon"
    sizes="180x180"
    href="ChatGPT%20Image%2028%20sept%202026,%2012_29_54%20p.m..png">

  <link
    rel="icon"
    type="image/png"
    sizes="512x512"
    href="ChatGPT%20Image%2028%20sept%202026,%2012_29_54%20p.m..png">

  <!-- Modo aplicación -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Centro de Operaciones">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="theme-color" content="#0f3d28">

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0f3d28;
    }

    iframe {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      background: #f6f3ee;
    }

    #aviso {
      display: none;
      box-sizing: border-box;
      width: 100%;
      min-height: 100%;
      padding: 28px;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.5;
    }
  </style>
</head>

<body>

  <div id="aviso"></div>

  <iframe
    id="app"
    title="Centro de Operaciones"
    allow="fullscreen">
  </iframe>

  <script>
    // URL de tu Web App de Google Apps Script
    var URL_APP =
      "https://script.google.com/macros/s/AKfycbylguEJ-dk1eO8J9FLl67YHmdDQmvJDgB6qsjUzcfKAGNv6lHHXUSTuOha0_Unf9ySeZQ/exec?mobile=1";

    (function () {
      var frame = document.getElementById("app");
      var aviso = document.getElementById("aviso");

      if (!/^https:\/\/script\.google\.com\/.+\/exec/.test(URL_APP)) {
        frame.style.display = "none";
        aviso.style.display = "block";

        aviso.innerHTML =
          "<b>Falta configurar la URL.</b><br><br>" +
          "Verificá la variable URL_APP del archivo.";
        return;
      }

      frame.src = URL_APP;
    })();
  </script>

</body>
</html>
